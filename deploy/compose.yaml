name: vndb-local
services:
  library:
    image: vndb-local:0.7.0
    build:
      context: ./release
      dockerfile: Dockerfile
    container_name: vndb-local-web
    restart: unless-stopped
    ports:
      - "${VNDB_BIND_IP:-127.0.0.1}:${VNDB_PORT:-5187}:8080"
    environment:
      Library__DataDirectory: /data
      Library__WriteKeyFile: /run/secrets/library_write_key
      ASPNETCORE_ENVIRONMENT: Production
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    volumes:
      - ./data:/data
      - ./secrets/library_write_key:/run/secrets/library_write_key:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD", "dotnet", "/app/Vndb.Web.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
