<!doctype html>
<html lang="zh-CN"><head><script src="/appearance.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料核对 · VNDB Local</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script><link rel="stylesheet" href="/tool-feedback.css"><script src="/tool-feedback.js" defer></script><link rel="stylesheet" href="/manage.css"><script src="/quality.js" defer></script><link rel="stylesheet" href="/appearance.css"></head>
<body data-page="quality"><main class="manager"><a href="/?catalog=1" class="plain">查看资料补全候选</a>
<div class="page-heading"><div><div class="eyebrow">DATA QUALITY</div><h1>资料核对</h1><p>优先处理本地存在或玩过的作品。查询公开资料不表示拥有；存在不表示可以运行。</p></div><button id="key-open" class="secondary">管理密钥</button></div>
<p id="notice" class="notice" role="status" hidden></p>
<section class="manager-block"><h2>资料缺口与待核对关系</h2><p id="summary" role="status">正在读取本地资料库…</p><form id="filters" class="manager-toolbar"><label>设备<select id="device"><option value="">全部设备及已游玩资料</option></select></label><label>问题类型<select id="kind"><option value="">全部问题</option></select></label><label>标题／VNDB ID<input id="query" maxlength="200"></label><button class="primary">筛选／刷新</button></form><div id="issues" class="manager-list"></div><nav class="pagination"><button id="previous" class="secondary">上一页</button><span id="page-label"></span><button id="next" class="secondary">下一页</button></nav></section>
<section class="manager-block"><h2>本机资料边界</h2><p>Web仅接收“在本地”布尔标记。目录、EXE、语言工具配置和整理复原证据均由客户端文档目录中的JSON管理，不上传到此站点。</p></section>
</main><dialog id="key-dialog"><form id="key-form"><h2>现有Web管理密钥</h2><label>密钥<input id="key" type="password" autocomplete="off"></label><button class="primary">保存到当前会话</button><button id="key-close" class="plain" type="button">取消</button></form></dialog></body></html>
