<!doctype html>
<html lang="zh-CN"><head><script src="/appearance.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话与离线活动 · VNDB Local</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script><link rel="stylesheet" href="/manage.css"><link rel="stylesheet" href="/tool-feedback.css"><script src="/tool-feedback.js" defer></script><script src="/import-input.js" defer></script><script src="/sessions.js" defer></script><link rel="stylesheet" href="/appearance.css"></head>
<body data-page="sessions"><main class="manager">
<div class="page-heading"><div><div class="eyebrow">PLAY ACTIVITY</div><h1>会话与离线活动</h1><p>计时按需使用。历史手工时间、会话及调整分别保存；冲突由你明确核对。</p></div><button id="refresh" class="secondary">重新读取／核对冲突</button></div>
<details class="tool-evidence"><summary>现有Web管理密钥（仅本次页面会话）</summary><label>密钥<input id="key" type="password" autocomplete="off"></label></details>
<p id="message" role="status" class="notice error" hidden></p><p id="session-summary" class="tool-summary" role="status">正在读取会话…</p><div id="tool-history"></div>
<section class="tool-section manager-block"><h2>导入离线活动</h2><p>选择客户端导出的活动JSON。逐文件提交并保留每份结果；未知结果只按原操作重试。公开资料metadata请到JSON导入页。</p><p id="activity-limits" class="small" role="status">正在读取服务端导入限额…</p><div class="tool-actions"><label>活动JSON<input id="files" type="file" accept=".json,application/json" multiple></label><button id="import" class="primary">提交所选活动批次</button></div><div id="receipts" aria-live="polite"></div></section>
<section class="tool-section manager-block"><h2>本次游玩与时间</h2><label>明确选择游玩经历<select id="play"></select></label><div id="time"></div><details class="tool-evidence"><summary>人工调整时间（高级）</summary><p>只记录对所选经历的调整，不改写历史基数或会话。未知历史仍保持未知。</p><form id="adjust" class="manager-toolbar"><label>调整秒数<input id="seconds" type="number" step="1" required></label><label>原因<input id="reason" maxlength="1000" required></label><button id="adjust-submit" class="secondary" disabled>提交本次人工调整</button></form><div id="adjust-result" aria-live="polite"></div></details></section>
<section class="tool-section"><h2>会话核对</h2><p class="small">运行中的会话不能人工决定。已结束且待核对的记录可以明确计入或排除。</p><div id="sessions"></div></section>
<section class="tool-section"><h2>个人编辑冲突</h2><div id="conflicts"></div></section>
</main></body></html>
